name: Research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and research dependencies
        run: python -m pip install -r requirements-tested.txt -e ".[research,dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run synthetic equity demonstration
        run: python -m factor_trend_research.task1 --demo --output outputs/task1_demo
      - name: Run synthetic multi-asset demonstration
        run: python -m factor_trend_research.task2 --demo --output outputs/task2_demo
